[project]
name = "gpt-oss-20b-core"
version = "0.1.0"
description = "Implementation of the GPT-OSS-20B Transformer architecture"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.1",
    "wandb>=0.16.0",
    "matplotlib>=3.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src"]